{% extends "base.html" %}

{% load static %}

{% block css %} 
<link rel="stylesheet" href="{% static 'accounts/css/login.css' %}"> 
{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center row-full-height mt-4 mt-lg-5">
    <div class="container-fluid ">
        <div class="row justify-content-center">
            <div class="col-md-11 col-lg-8 box-height">
                <div class="login-container row g-0 rounded overflow-hidden shadow">
                    <div class="col-md-6 d-none d-md-block img-container">
                        <img loading="lazy" src="{% static 'accounts/img/login.webp' %}" alt="Eğitim Görseli" class="login-img rounded-start">
                    </div>
                    {# Right panel - Login form #}
                    <div class="col-md-6 d-flex align-items-center justify-content-center p-4 bg-white">
                        <div class="w-100">
                            <div class="d-flex flex-column align-items-center mb-3">
                                <img class="login-logo" loading="lazy" src="{% static 'img/logo.webp' %}" alt="login-img" style="width: 120px;">
                                <h6 class="login-title text-center">METIN ZONTUL UNIVERSITY</h6>
                            </div>
                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <input type="text" name="username" class="form-control" placeholder="username" required>
                                </div>
                                <div class="mb-3">
                                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                                </div>
                                
                                {# Error message #}
                                {% if error_message %}
                                    <div class="mb-3 ms-1 mt-2">
                                        <p class="text-danger" id="loginError">{{ error_message }}</p>
                                    </div>
                                {% endif %}
                                <button type="submit" class="btn btn-login w-100">Log in</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
